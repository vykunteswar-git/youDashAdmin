<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/youdash-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YouDash Express admin console" />
    <title>YouDash Admin</title>
    <style>
      html, body { margin: 0; background: #f8fafc; }
      #app-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #111827;
      }
      #app-splash img { width: 44px; height: 44px; }
      #app-splash .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: splash-spin 0.75s linear infinite;
      }
      #app-splash strong { font-size: 15px; }
      #app-splash span { font-size: 13px; color: #6b7280; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-live="polite" aria-busy="true">
        <img src="/youdash-logo.svg" alt="" width="44" height="44" />
        <div class="splash-spinner" aria-hidden="true"></div>
        <strong>YouDash Express</strong>
        <span>Loading admin console…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
